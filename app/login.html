<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forja · Iniciar sesión</title>
<script>(function(){var w=console.warn;console.warn=function(){var a=arguments[0];if(typeof a==="string"&&a.indexOf("cdn.tailwindcss.com")!==-1)return;return w.apply(console,arguments)};})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/forja.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/forja.css">
<link rel="stylesheet" href="../assets/forja-app.css">
<script src="../assets/forja-app.js"></script>
</head>
<body>
<div class="app-frame">
  <div class="auth-wrap">

    <!-- Identidad del gimnasio (tenant) -->
    <div class="flex flex-col items-center text-center mt-8 mb-10">
      <div class="auth-logo mb-4">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-1 5-2 6 1 0 4-1 5 2 2 4-2 8-3 8 2-4-1-5-2-5 .5 2-1 3-2 3-2 0-3-2-3-4 0-3 4-5 4-7 0-1-1-2-2-3 4 0 8 1 8 6"/></svg>
      </div>
      <h1 class="a-h" style="font-size:26px">Forja Box</h1>
      <p class="a-muted text-sm mt-1">Providencia · Santiago</p>
    </div>

    <!-- Form -->
    <div class="space-y-4">
      <div>
        <h2 class="a-h" style="font-size:20px">Inicia sesión</h2>
        <p class="a-muted text-sm mt-1">Entra a tu cuenta de socio.</p>
      </div>
      <div>
        <label class="fj-label">Correo</label>
        <input class="fj-input auth-input" type="email" inputmode="email" placeholder="tu@correo.cl" value="vale@correo.cl">
      </div>
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="fj-label" style="margin:0">Contraseña</label>
          <a href="recuperar-contrasena.html" class="text-xs font-semibold" style="color:var(--fj-brand-600)">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="relative">
          <input id="pw" class="fj-input auth-input" type="password" placeholder="••••••••" value="contrasena123" style="padding-right:46px">
          <button onclick="const i=document.getElementById('pw');i.type=i.type==='password'?'text':'password'" aria-label="Mostrar contraseña" class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-400" style="background:none;border:0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <a href="hoy.html" class="a-btn a-btn-primary" style="margin-top:6px">Iniciar sesión</a>
    </div>

    <!-- Onboarding liderado por el gym (no auto-registro) -->
    <div class="acard acard-pad mt-6 flex items-center gap-3" style="background:rgba(251,82,21,.06);border-color:rgba(251,82,21,.2)">
      <span class="w-9 h-9 rounded-xl grid place-items-center shrink-0" style="background:rgba(251,82,21,.14);color:var(--fj-brand-700)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      </span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-ink-900">¿Primera vez?</p>
        <p class="a-muted text-xs">Tu gimnasio te envió una invitación por correo.</p>
      </div>
      <a href="activar-cuenta.html" class="text-xs font-bold shrink-0" style="color:var(--fj-brand-600)">Activar →</a>
    </div>

    <!-- Plataforma (la app es del gym; Forja es el producto detrás) -->
    <div class="auth-foot">
      <p class="a-muted text-xs">Hecho con <span class="font-semibold" style="color:var(--fj-ink-500)">Forja</span> · plataforma para gimnasios</p>
    </div>

  </div>
</div>
</body>
</html>

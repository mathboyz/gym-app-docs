<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forja · Cambiar contraseña</title>
<script>(function(){var w=console.warn;console.warn=function(){var a=arguments[0];if(typeof a==="string"&&a.indexOf("cdn.tailwindcss.com")!==-1)return;return w.apply(console,arguments)};})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/forja.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/forja.css">
<link rel="stylesheet" href="../assets/forja-app.css">
<script src="../assets/forja-app.js"></script>
</head>
<body>
<div class="app-frame">
  <header class="app-bar">
    <a href="ajustes.html" class="fj-icon-btn" aria-label="Volver">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="flex-1">
      <p class="a-eyebrow">cuenta</p>
      <p class="app-bar-title">Cambiar contraseña</p>
    </div>
  </header>

  <div class="auth-wrap" style="padding-top:8px">
    <div class="mt-4">
      <span class="w-12 h-12 rounded-2xl grid place-items-center" style="background:rgba(251,82,21,.12);color:var(--fj-brand-700)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <h2 class="a-h mt-4" style="font-size:21px">Cambia tu contraseña</h2>
      <p class="a-sub text-sm mt-1.5">Primero confirma la actual. La nueva debe tener mínimo 8 caracteres.</p>
    </div>

    <div class="space-y-4 mt-6">
      <div>
        <label class="fj-label">Contraseña actual</label>
        <input class="fj-input auth-input" type="password" placeholder="••••••••">
        <a href="recuperar-contrasena.html" class="text-xs font-semibold inline-block mt-1.5" style="color:var(--fj-brand)">¿La olvidaste?</a>
      </div>
      <div>
        <label class="fj-label">Nueva contraseña</label>
        <input class="fj-input auth-input" type="password" placeholder="••••••••">
      </div>
      <div>
        <label class="fj-label">Confírmala</label>
        <input class="fj-input auth-input" type="password" placeholder="••••••••">
      </div>
      <div class="acard acard-pad" style="padding:12px 14px">
        <p class="a-muted text-xs flex items-center gap-2"><span style="color:var(--tx-green)">✓</span> Al menos 8 caracteres</p>
        <p class="a-muted text-xs flex items-center gap-2 mt-1"><span style="color:var(--tx-green)">✓</span> Una mayúscula y un número</p>
        <p class="a-muted text-xs flex items-center gap-2 mt-1"><span style="color:var(--tx-green)">✓</span> Distinta a la anterior</p>
      </div>
      <button class="a-btn a-btn-primary" onclick="ForjaApp.toast('Contraseña actualizada ✓'); setTimeout(function(){ location.href='ajustes.html' }, 900)">Guardar contraseña</button>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forja · Recuperar contraseña</title>
<script>(function(){var w=console.warn;console.warn=function(){var a=arguments[0];if(typeof a==="string"&&a.indexOf("cdn.tailwindcss.com")!==-1)return;return w.apply(console,arguments)};})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/forja.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/forja.css">
<link rel="stylesheet" href="../assets/forja-app.css">
<script src="../assets/forja-app.js"></script>
</head>
<body>
<div class="app-frame">
  <header class="app-bar">
    <a href="login.html" class="fj-icon-btn" aria-label="Volver">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <p class="app-bar-title" style="font-size:18px">Recuperar contraseña</p>
  </header>

  <div class="auth-wrap" style="padding-top:8px">

    <!-- Estado 1: pedir correo -->
    <div id="step-form" class="space-y-5">
      <div class="mt-4">
        <span class="w-12 h-12 rounded-2xl grid place-items-center" style="background:rgba(251,82,21,.12);color:var(--fj-brand-700)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
        </span>
        <h2 class="a-h mt-4" style="font-size:21px">¿Olvidaste tu contraseña?</h2>
        <p class="a-sub text-sm mt-1.5">Ingresa tu correo y te enviaremos un enlace para crear una nueva.</p>
      </div>
      <div>
        <label class="fj-label">Correo</label>
        <input class="fj-input auth-input" type="email" inputmode="email" placeholder="tu@correo.cl" value="vale@correo.cl">
      </div>
      <button onclick="document.getElementById('step-form').hidden=true;document.getElementById('step-sent').hidden=false" class="a-btn a-btn-primary">Enviar enlace</button>
    </div>

    <!-- Estado 2: enviado -->
    <div id="step-sent" hidden class="text-center mt-8">
      <span class="w-16 h-16 rounded-3xl grid place-items-center mx-auto" style="background:rgba(24,169,87,.14);color:var(--tx-green)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </span>
      <h2 class="a-h mt-5" style="font-size:21px">Revisa tu correo</h2>
      <p class="a-sub text-sm mt-2 px-2">Enviamos un enlace a <span class="font-semibold text-ink-900">vale@correo.cl</span>. Ábrelo para crear tu nueva contraseña.</p>
      <a href="nueva-contrasena.html" class="a-btn a-btn-primary mt-6">Abrir el enlace (demo)</a>
      <button onclick="document.getElementById('step-sent').hidden=true;document.getElementById('step-form').hidden=false" class="a-btn a-btn-ghost mt-3">Reenviar correo</button>
    </div>

    <div class="auth-foot">
      <p class="a-muted text-xs">¿Lo recordaste? <a href="login.html" class="font-semibold" style="color:var(--fj-brand-600)">Inicia sesión</a></p>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forja · Calendario</title>
<script>(function(){var w=console.warn;console.warn=function(){var a=arguments[0];if(typeof a==="string"&&a.indexOf("cdn.tailwindcss.com")!==-1)return;return w.apply(console,arguments)};})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/forja.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/forja.css">
<script src="../assets/forja.js"></script>
<style>
  .cal-wrap{flex:1;overflow:auto;}
  .cal-grid{display:grid;grid-template-columns:60px repeat(7,minmax(150px,1fr));min-width:1100px;}
  .cal-cell{border-right:1px solid var(--fj-ink-100);border-bottom:1px solid var(--fj-ink-100);min-height:62px;padding:5px;position:relative;}
  .cal-cell:hover .cal-add{opacity:1;}
  .cal-add{position:absolute;inset:5px;border:1.5px dashed var(--fj-ink-200);border-radius:9px;display:grid;place-items:center;
    color:var(--fj-ink-300);opacity:0;transition:opacity .12s;cursor:pointer;}
  .cal-add:hover{border-color:var(--fj-brand);color:var(--fj-brand);background:rgba(251,82,21,.04);}
  .cal-hourcol{border-right:1px solid var(--fj-ink-200);border-bottom:1px solid var(--fj-ink-100);
    font-family:"JetBrains Mono";font-size:11px;color:var(--fj-ink-400);text-align:right;padding:6px 8px;}
  .cal-headcell{padding:10px 8px;text-align:center;border-right:1px solid var(--fj-ink-100);}
  .cls{display:block;border-radius:9px;padding:6px 8px;font-size:11.5px;line-height:1.35;cursor:pointer;border:1px solid;transition:transform .08s,box-shadow .08s;height:100%;}
  .cls:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.10);}
  .cls-crossfit{background:#FFF3EE;border-color:var(--m-crossfit);color:#B83309;}
  .cls-gimnasia{background:#EEF3FF;border-color:var(--m-gimnasia);color:#2350B0;}
  .cls-haltero{background:#F3EFFF;border-color:var(--m-haltero);color:#5B21B6;}
  .cls-endurance{background:#EDFAF3;border-color:var(--m-endurance);color:#0F7A3F;}
  .col-hoy{background:#FFFBF9;}
  [data-theme="dark"] .cls-crossfit{background:rgba(251,82,21,.12);border-color:rgba(251,82,21,.55);color:#FFB088;}
  [data-theme="dark"] .cls-gimnasia{background:rgba(62,123,250,.12);border-color:rgba(62,123,250,.5);color:#8FB4FF;}
  [data-theme="dark"] .cls-haltero{background:rgba(124,58,237,.16);border-color:rgba(124,58,237,.55);color:#BFA3FF;}
  [data-theme="dark"] .cls-endurance{background:rgba(24,169,87,.13);border-color:rgba(24,169,87,.5);color:#5EE49B;}
  [data-theme="dark"] .col-hoy{background:rgba(251,82,21,.06);}
  .seg[hidden]{display:none;}
</style>
</head>
<body data-immersive>
<div class="fj-shell" id="fj-shell" data-immersive>
  <div class="fj-main">

    <!-- Barra inmersiva -->
    <div class="fj-immersive-bar">
      <div style="display:flex;align-items:center;gap:14px">
        <a href="dashboard.html" class="fj-icon-btn" title="Volver al panel" aria-label="Volver al panel">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
        <span class="fj-logo-mark" style="width:28px;height:28px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-1 5-2 6 1 0 4-1 5 2 2 4-2 8-3 8 2-4-1-5-2-5 .5 2-1 3-2 3-2 0-3-2-3-4 0-3 4-5 4-7 0-1-1-2-2-3 4 0 8 1 8 6"/></svg>
        </span>
        <div>
          <p class="fj-eyebrow">Forja Box · Providencia</p>
          <h1 class="fj-title" style="font-size:18px">Calendario</h1>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:8px">
        <button class="fj-icon-btn" aria-label="Semana anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span class="fj-mono text-sm font-semibold text-ink-700">2 – 8 jun 2026</span>
        <button class="fj-icon-btn" aria-label="Semana siguiente"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
        <button class="fj-btn fj-btn-ghost fj-btn-sm">Hoy</button>
      </div>

      <div style="display:flex;align-items:center;gap:10px">
        <div class="fj-pills">
          <span class="fj-pill" aria-selected="true">Semana</span>
          <span class="fj-pill">Día</span>
        </div>
        <button class="fj-btn fj-btn-primary fj-btn-sm" onclick="openCreate(null,null)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nueva clase
        </button>
      </div>
    </div>

    <!-- Leyenda de modalidades -->
    <div style="display:flex;align-items:center;gap:18px;padding:8px 18px;background:var(--fj-surface);border-bottom:1px solid var(--fj-ink-100);">
      <span class="fj-eyebrow">Modalidades</span>
      <span class="flex items-center gap-1.5 text-xs text-ink-500"><span class="fj-dot" style="background:var(--m-crossfit)"></span>CrossFit</span>
      <span class="flex items-center gap-1.5 text-xs text-ink-500"><span class="fj-dot" style="background:var(--m-gimnasia)"></span>Gimnasia</span>
      <span class="flex items-center gap-1.5 text-xs text-ink-500"><span class="fj-dot" style="background:var(--m-haltero)"></span>Halterofilia</span>
      <span class="flex items-center gap-1.5 text-xs text-ink-500"><span class="fj-dot" style="background:var(--m-endurance)"></span>Endurance</span>
      <span class="ml-auto text-xs text-ink-400">Clic en una clase para gestionarla · clic en un espacio vacío para agendar</span>
    </div>

    <!-- Grilla -->
    <div class="cal-wrap">
      <div class="cal-grid" id="calGrid"></div>
    </div>

  </div>
</div>

<script>
const DAYS = [['LUN','2'],['MAR','3'],['MIÉ','4'],['JUE','5'],['VIE','6'],['SÁB','7'],['DOM','8']];
const HOURS = ['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','17:00','18:00','19:00','20:00'];
const TODAY = 5; // sábado
// clases: [hora, día, modalidad, coach, inscritos, cupo, formato, nombreWOD]
const CLASSES = [
  ['07:00',0,'crossfit','Vale',12,16,'fortime','Fran'], ['07:00',2,'crossfit','Vale',10,16,'amrap',"20'"], ['07:00',4,'crossfit','Vale',14,16,'fortime','Helen'], ['07:00',5,'crossfit','Vale',8,12,'emom',"12'"],
  ['08:00',0,'gimnasia','Nacho',8,12], ['08:00',2,'gimnasia','Nacho',7,12], ['08:00',4,'gimnasia','Nacho',9,12],
  ['09:00',1,'haltero','Nacho',6,10,'emom','Snatch'], ['09:00',3,'haltero','Nacho',5,10,'emom','Clean'], ['09:00',5,'crossfit','Vale',11,12,'amrap',"15'"], ['09:00',6,'endurance','Vale',10,16],
  ['10:00',0,'endurance','Vale',14,16], ['10:00',2,'endurance','Vale',12,16], ['10:00',4,'endurance','Vale',15,16],
  ['11:00',5,'gimnasia','Nacho',7,12], ['11:00',6,'crossfit','Nacho',6,12,'fortime','Diane'],
  ['12:00',0,'crossfit','Nacho',10,16,'amrap',"18'"], ['12:00',1,'crossfit','Nacho',9,16,'fortime','Cindy'], ['12:00',2,'crossfit','Nacho',11,16,'emom',"16'"], ['12:00',3,'crossfit','Nacho',8,16,'tabata','Abs'], ['12:00',4,'crossfit','Nacho',13,16,'fortime','Grace'],
  ['14:00',1,'haltero','Nacho',4,10,'emom','Jerk'], ['14:00',3,'haltero','Nacho',6,10,'emom','Snatch'],
  ['17:00',0,'crossfit','Vale',15,16,'fortime','Murph'], ['17:00',2,'crossfit','Vale',16,16,'amrap',"20'"], ['17:00',4,'crossfit','Vale',14,16,'fortime','Fran'],
  ['18:00',0,'gimnasia','Nacho',8,12], ['18:00',1,'crossfit','Vale',12,16,'emom',"14'"], ['18:00',2,'gimnasia','Nacho',10,12], ['18:00',3,'crossfit','Vale',11,16,'fortime','Karen'], ['18:00',4,'gimnasia','Nacho',9,12],
  ['19:00',0,'crossfit','Vale',14,16,'amrap',"16'"], ['19:00',1,'endurance','Vale',10,16], ['19:00',2,'crossfit','Vale',13,16,'fortime','Annie'], ['19:00',3,'endurance','Vale',9,16], ['19:00',4,'crossfit','Vale',16,16,'emom',"18'"],
];
const MODLABEL = {crossfit:'CrossFit',gimnasia:'Gimnasia',haltero:'Halterofilia',endurance:'Endurance'};
function occBadge(e,c){ const r=e/c; if(r>=1) return 'fj-badge-danger'; if(r>=.85) return 'fj-badge-warning'; if(r>=.5) return 'fj-badge-info'; return 'fj-badge-success'; }

function render() {
  const grid = document.getElementById('calGrid');
  let html = '<div style="display:contents">';
  html += '<div class="cal-headcell" style="position:sticky;top:0;z-index:5;background:var(--fj-surface);border-bottom:1px solid var(--fj-ink-200)"></div>';
  DAYS.forEach((d,i)=>{ const hoy = i===TODAY;
    html += `<div class="cal-headcell ${hoy?'col-hoy':''}" style="position:sticky;top:0;z-index:5;background:var(--fj-surface);border-bottom:1px solid var(--fj-ink-200)">
      <p class="fj-eyebrow ${hoy?'!text-brand-600':''}">${d[0]}${hoy?' · HOY':''}</p>
      <p class="font-display font-bold text-lg ${hoy?'text-brand-600':'text-ink-900'} mt-0.5">${d[1]}</p></div>`; });
  html += '</div>';
  HOURS.forEach(h=>{
    html += `<div class="cal-hourcol">${h}</div>`;
    for(let day=0; day<7; day++){
      const c = CLASSES.find(x=>x[0]===h && x[1]===day);
      const hoy = day===TODAY;
      if(c){
        const mod=c[2], coach=c[3], en=c[4], cap=c[5], fmt=c[6], wod=c[7];
        const fmtChip = fmt ? `<span class="fj-fmt fj-fmt-${fmt}" style="margin-top:3px;display:inline-flex">${fmt==='fortime'?'For Time':fmt.toUpperCase()}</span>` : '';
        html += `<div class="cal-cell ${hoy?'col-hoy':''}">
          <a class="cls cls-${mod}" onclick='openSession(${JSON.stringify(c)})'>
            <div style="display:flex;justify-content:space-between;align-items:start;gap:4px">
              <span style="font-weight:700">${MODLABEL[mod]}</span>
              <span class="fj-badge ${occBadge(en,cap)}" style="height:18px;font-size:10px;padding:0 6px">${en}/${cap}</span>
            </div>
            <div style="opacity:.8">${h} · ${coach}${wod?' · '+wod:''}</div>
            ${fmtChip}
          </a></div>`;
      } else {
        html += `<div class="cal-cell ${hoy?'col-hoy':''}"><div class="cal-add" onclick="openCreate('${h}',${day})">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div></div>`;
      }
    }
  });
  grid.innerHTML = html;
}

/* ---- Drawer: GESTIONAR SESIÓN (prioriza RUTINA, asistencia colapsable) ---- */
function openSession(c){
  const h=c[0], day=c[1], mod=c[2], coach=c[3], en=c[4], cap=c[5], fmt=c[6], wod=c[7];
  const dayName = {0:'Lunes 2',1:'Martes 3',2:'Miércoles 4',3:'Jueves 5',4:'Viernes 6',5:'Sábado 7',6:'Domingo 8'}[day];
  const hasRoutine = !!wod;
  const fmtLabel = fmt==='fortime'?'For Time':(fmt||'').toUpperCase();
  const roster = [
    ['Camila Soto','Plan Full','presente'],['Matías Bravo','Plan Ilimitado','presente'],['Valentina Pérez','Plan Full','pendiente'],
    ['José Tapia','Pack 10','pendiente'],['Andrea Lagos','Plan 3x','pendiente'],['Diego Mora','Plan Full','presente'],
    ['Felipe Ramos','Plan Ilimitado','presente'],['Isidora Contreras','Plan Full','pendiente'],['Pancho Díaz','Plan Full','pendiente'],
    ['Javiera Núñez','Plan Ilimitado','presente'],['Tomás Rojas','Pack 10','pendiente'],['Fernanda Lira','Plan 3x','pendiente'],
    ['Benjamín Soto','Plan Full','pendiente'],['Antonia Vega','Plan Full','presente'],['Martín Pino','Plan Ilimitado','pendiente'],['Sofía Caro','Plan Full','pendiente']
  ];
  const rosterHtml = roster.slice(0,en).map(r=>{
    const ini = r[0].split(' ').map(w=>w[0]).join('');
    const pres = r[2]==='presente';
    return `<div class="fj-row fj-row-static" style="padding:10px 0">
      <span class="fj-avatar" style="width:30px;height:30px;font-size:11px">${ini}</span>
      <div class="flex-1 min-w-0"><p class="text-sm font-semibold text-ink-900">${r[0]}</p><p class="text-xs text-ink-400">${r[1]}</p></div>
      <span class="fj-badge ${pres?'fj-badge-success':'fj-badge-neutral'}">${pres?'✓ Presente':'Pendiente'}</span></div>`;
  }).join('');

  const routineBlock = hasRoutine
    ? `<div class="fj-panel" style="padding:16px;border-color:var(--fj-brand);background:rgba(251,82,21,.03)">
         <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">
           <div style="display:flex;align-items:center;gap:8px"><span class="fj-fmt fj-fmt-${fmt}">${fmtLabel}</span><span class="font-display font-bold text-ink-900">${wod}</span></div>
           <a href="constructor-rutina.html" class="text-xs font-semibold text-brand-600">Editar rutina →</a>
         </div>
         <div class="space-y-1.5">
           <div class="flex items-center gap-2 text-sm text-ink-600"><span class="fj-eyebrow" style="width:64px">Warm-up</span> Row 500m + movilidad</div>
           <div class="flex items-center gap-2 text-sm text-ink-600"><span class="fj-eyebrow" style="width:64px">Skill</span> Thruster 5×3</div>
           <div class="flex items-center gap-2 text-sm text-ink-900 font-medium"><span class="fj-eyebrow !text-brand-600" style="width:64px">WOD</span> 21-15-9 Thrusters + Pull-ups</div>
         </div>
       </div>`
    : `<div class="fj-panel" style="padding:20px;border-style:dashed;text-align:center">
         <p class="text-sm font-semibold text-ink-700 mb-1">Esta clase no tiene rutina asignada</p>
         <p class="text-xs text-ink-400 mb-4">Carga una plantilla o construye una nueva</p>
         <div style="display:flex;gap:8px;justify-content:center">
           <a href="rutinas.html" class="fj-btn fj-btn-ghost fj-btn-sm">Cargar plantilla</a>
           <a href="constructor-rutina.html" class="fj-btn fj-btn-primary fj-btn-sm">Construir rutina</a>
         </div>
       </div>`;

  Forja.Drawer.open(`
    <div class="fj-drawer-head">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="fj-dot" style="width:12px;height:12px;background:var(--m-${mod})"></span>
        <div><p class="fj-eyebrow">${dayName} · ${h}</p><h2 class="font-display font-bold text-lg text-ink-900">${MODLABEL[mod]}</h2></div>
      </div>
      <button class="fj-icon-btn" data-fj-close aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="fj-drawer-body space-y-5">

      <div><p class="fj-eyebrow mb-2">Rutina del día</p>${routineBlock}</div>

      <div>
        <p class="fj-eyebrow mb-2">Sesión</p>
        <div class="grid grid-cols-2 gap-3">
          <div class="fj-panel" style="padding:12px"><p class="text-xs text-ink-400">Coach</p><p class="text-sm font-semibold text-ink-900 mt-0.5">${coach==='Vale'?'Vale Fuentes':'Nacho Tapia'}</p></div>
          <div class="fj-panel" style="padding:12px"><p class="text-xs text-ink-400">Ocupación</p><p class="text-sm font-semibold text-ink-900 mt-0.5 fj-mono">${en} / ${cap}</p></div>
        </div>
      </div>

      <div>
        <button onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:6px 0">
          <span class="fj-eyebrow">Inscritos · ${en}</span>
          <span style="display:flex;align-items:center;gap:8px"><span class="fj-badge fj-badge-success" style="cursor:pointer" onclick="event.stopPropagation();window.Forja&&Forja.toast('Asistencia marcada ✓')">Marcar asistencia</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A91A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
        </button>
        <div class="seg" hidden>${rosterHtml}</div>
      </div>

    </div>
    <div class="fj-drawer-foot">
      <button class="fj-btn fj-btn-danger fj-btn-sm" data-fj-close>Cancelar sesión</button>
      <a href="detalle-sesion.html" class="fj-btn fj-btn-ghost fj-btn-sm">Ver detalle completo</a>
    </div>`);
}

/* ---- Drawer: CREAR CLASE rápido (celda vacía) ---- */
function openCreate(hour, day){
  const dayName = day!==null ? {0:'Lunes 2',1:'Martes 3',2:'Miércoles 4',3:'Jueves 5',4:'Viernes 6',5:'Sábado 7',6:'Domingo 8'}[day] : '';
  Forja.Drawer.open(`
    <div class="fj-drawer-head">
      <div><p class="fj-eyebrow">Agendar ${dayName?dayName+' · '+hour:''}</p><h2 class="font-display font-bold text-lg text-ink-900">Nueva clase</h2></div>
      <button class="fj-icon-btn" data-fj-close aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="fj-drawer-body space-y-4">
      <div><label class="fj-label">Modalidad</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          ${['crossfit','gimnasia','haltero','endurance'].map((m,i)=>`<label style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--fj-ink-200);border-radius:12px;cursor:pointer">
            <input type="radio" name="mod" ${i===0?'checked':''} style="accent-color:var(--fj-brand)"><span class="fj-dot" style="background:var(--m-${m})"></span><span class="text-sm font-medium">${MODLABEL[m]}</span></label>`).join('')}
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="fj-label">Hora</label><input class="fj-input" value="${hour||'07:00'}"></div>
        <div><label class="fj-label">Duración</label><select class="fj-input"><option>60 min</option><option>45 min</option><option>90 min</option></select></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="fj-label">Coach</label><select class="fj-input"><option>Vale Fuentes</option><option>Nacho Tapia</option></select></div>
        <div><label class="fj-label">Cupo</label><input class="fj-input fj-mono" value="16"></div>
      </div>
      <div><label class="fj-label">Rutina</label>
        <select class="fj-input"><option>Sin rutina (asignar después)</option><option>Cargar plantilla guardada…</option></select>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fj-ink-600)"><input type="checkbox" checked style="accent-color:var(--fj-brand)"> Repetir todas las semanas</label>
    </div>
    <div class="fj-drawer-foot">
      <button class="fj-btn fj-btn-ghost fj-btn-sm" data-fj-close>Cancelar</button>
      <button class="fj-btn fj-btn-primary fj-btn-sm" data-fj-close>Crear clase</button>
    </div>`);
}

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forja · Constructor de rutina</title>
<script>(function(){var w=console.warn;console.warn=function(){var a=arguments[0];if(typeof a==="string"&&a.indexOf("cdn.tailwindcss.com")!==-1)return;return w.apply(console,arguments)};})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/forja.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/forja.css">
<script src="../assets/forja.js"></script>
<style>
  .build{flex:1;display:flex;overflow:hidden;}
  /* panel biblioteca */
  .lib{width:300px;flex-shrink:0;border-right:1px solid var(--fj-ink-200);background:var(--fj-surface);display:flex;flex-direction:column;}
  .lib-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;}
  .ex{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--fj-ink-200);border-radius:11px;
    cursor:grab;background:var(--fj-surface);transition:border-color .12s,box-shadow .12s;}
  .ex:hover{border-color:var(--fj-brand);box-shadow:0 2px 8px rgba(251,82,21,.10);}
  .ex:active{cursor:grabbing;}
  .ex-grip{color:var(--fj-ink-300);}
  /* canvas */
  .canvas{flex:1;overflow-y:auto;background:var(--fj-ink-50);padding:24px;}
  .canvas-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  .cat{background:var(--fj-surface);border:1px solid var(--fj-ink-200);border-radius:16px;overflow:hidden;}
  .cat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--fj-ink-100);}
  .cat-zone{padding:12px 16px;display:flex;flex-direction:column;gap:8px;min-height:64px;transition:background .12s;}
  .cat-zone.fj-dropping{background:rgba(251,82,21,.05);outline:2px dashed var(--fj-brand);outline-offset:-6px;border-radius:12px;}
  .cat-empty{text-align:center;color:var(--fj-ink-300);font-size:13px;padding:14px;border:1.5px dashed var(--fj-ink-200);border-radius:11px;}
  .row-ex{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--fj-ink-50);border:1px solid var(--fj-ink-100);border-radius:11px;}
  .mini{height:32px;width:58px;padding:0 8px;border:1px solid var(--fj-ink-200);border-radius:8px;font-family:"JetBrains Mono";font-size:12px;text-align:center;background:var(--fj-surface);}
  .seln{height:32px;padding:0 8px;border:1px solid var(--fj-ink-200);border-radius:8px;font-size:12px;background:var(--fj-surface);}
</style>
</head>
<body data-immersive>
<div class="fj-shell" data-immersive>
  <div class="fj-main">

    <!-- Barra inmersiva -->
    <div class="fj-immersive-bar">
      <div style="display:flex;align-items:center;gap:14px">
        <a href="calendario.html" class="fj-icon-btn" title="Volver al calendario" aria-label="Volver">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="fj-dot" style="width:11px;height:11px;background:var(--m-crossfit)"></span>
          <div><p class="fj-eyebrow">CrossFit · Sáb 7 jun · 07:00</p><h1 class="fj-title" style="font-size:18px">Constructor de rutina</h1></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="fj-pills"><span class="fj-pill" aria-selected="true">Borrador</span><span class="fj-pill">Publicada</span></div>
        <button class="fj-btn fj-btn-ghost fj-btn-sm" onclick="openTemplates()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Cargar plantilla
        </button>
        <button class="fj-btn fj-btn-primary fj-btn-sm">Publicar rutina</button>
      </div>
    </div>

    <div class="build">
      <!-- Biblioteca de ejercicios (arrastrable) -->
      <aside class="lib">
        <div style="padding:14px;border-bottom:1px solid var(--fj-ink-100)">
          <p class="fj-eyebrow mb-2">Biblioteca de ejercicios</p>
          <div class="fj-search" style="display:block"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Buscar ejercicio…" style="width:100%"></div>
          <div class="fj-pills mt-2" style="flex-wrap:wrap;background:transparent;padding:0;gap:5px">
            <span class="fj-pill fj-btn-sm" aria-selected="true" style="height:26px;border:1px solid var(--fj-ink-200);background:var(--fj-surface)">Todos</span>
            <span class="fj-pill" style="height:26px">Halterofilia</span>
            <span class="fj-pill" style="height:26px">Gimnástico</span>
            <span class="fj-pill" style="height:26px">Cardio</span>
          </div>
        </div>
        <div class="lib-list" id="lib"></div>
        <div style="padding:10px 14px;border-top:1px solid var(--fj-ink-100)">
          <button onclick="location.href='ejercicios.html'" class="fj-btn fj-btn-ghost fj-btn-sm" style="width:100%">+ Crear ejercicio</button>
        </div>
      </aside>

      <!-- Canvas de la rutina -->
      <main class="canvas">
        <div class="canvas-inner" id="canvas"></div>
      </main>
    </div>

  </div>
</div>

<script>
const LIB = {
  Halterofilia:['Thruster','Clean & Jerk','Snatch','Deadlift','Front Squat','Overhead Press','Power Clean'],
  Gimnástico:['Pull-up','Toes to Bar','Muscle-up','Handstand Push-up','Box Jump','Burpee','Wall Ball'],
  Cardio:['Row','Run','Assault Bike','Double Unders','Ski Erg'],
};
const FORMATS = [['fortime','For Time'],['amrap','AMRAP'],['emom','EMOM'],['tabata','Tabata'],['series','Series y reps']];

// estado: bloques de la rutina (categorías ricas + descansos entre ellas)
let CATS = [
  {type:'cat', name:'Warm-up', fmt:'series', lb:false, cap:'', rest:'', mode:'individual', open:false, items:[{ex:'Row',a:'500',b:'m',w:''},{ex:'Burpee',a:'2',b:'x10',w:''}]},
  {type:'cat', name:'Skill', fmt:'emom', lb:true, cap:'12:00', rest:'', mode:'individual', open:false, items:[{ex:'Thruster',a:'5',b:'x3',w:'75',wu:'%'}]},
  {type:'rest', dur:'3:00'},
  {type:'cat', name:'WOD', fmt:'fortime', lb:true, cap:'20:00', rest:'1:00', mode:'duplas', open:false, items:[{ex:'Thruster',a:'21-15-9',b:'reps',w:'43'},{ex:'Pull-up',a:'21-15-9',b:'reps',w:''}]},
];
const xsvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A91A1" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
// disponibilidad para duelos (catálogo del coach) + logro robable asociado
let DUEL = { on:true, belt:'Rey de Fran' };
const MODEL = {individual:'Individual', duplas:'En duplas', equipo:'Equipos'};

function libHtml(){
  return Object.entries(LIB).map(([grp,exs])=>
    `<p class="fj-eyebrow" style="margin:6px 0 2px">${grp}</p>` +
    exs.map(e=>`<div class="ex" draggable="true" data-fj-drag="${e}">
      <span class="ex-grip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg></span>
      <span class="text-sm font-medium text-ink-800 flex-1">${e}</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B6BCC8" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>`).join('')
  ).join('');
}

function exRow(it, ci, ii){
  return `<div class="row-ex">
    <span class="ex-grip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg></span>
    <span class="text-sm font-semibold text-ink-900" style="flex:1;min-width:0">${it.ex}</span>
    <input class="mini" value="${it.a}" title="Series / reps">
    <input class="seln" value="${it.b}" style="width:62px" title="Unidad">
    <div style="display:flex;align-items:center;gap:3px"><input class="mini" value="${it.w}" placeholder="–" style="width:46px" title="Peso o % del 1RM"><select class="seln" style="width:64px" title="kg fijo o % del 1RM de cada atleta" onchange="CATS[${ci}].items[${ii}].wu=this.value"><option ${it.wu!=='%'?'selected':''}>kg</option><option value="%" ${it.wu==='%'?'selected':''}>%1RM</option></select></div>
    <select class="seln" title="Escala"><option>Rx</option><option>Scaled</option></select>
    <button class="fj-icon-btn" style="width:28px;height:28px" onclick="delEx(${ci},${ii})" aria-label="Quitar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#E5484D" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>`;
}

function fmtSel(ci, cur){
  return `<select class="seln" onchange="setFmt(${ci},this.value)" style="height:30px">
    ${FORMATS.map(f=>`<option value="${f[0]}" ${f[0]===cur?'selected':''}>${f[1]}</option>`).join('')}</select>`;
}

const fmtLabel = f => (FORMATS.find(x=>x[0]===f)||['','—'])[1];

function cfgStrip(c,bi){
  return `<div style="padding:14px 16px;background:var(--fj-ink-50);border-bottom:1px solid var(--fj-ink-100);display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
    <div><label class="fj-label" style="margin-bottom:4px">Estilo / formato</label>
      <select class="fj-input" style="height:38px" onchange="CATS[${bi}].fmt=this.value;render()">${FORMATS.map(f=>`<option value="${f[0]}" ${f[0]===c.fmt?'selected':''}>${f[1]}</option>`).join('')}</select></div>
    <div><label class="fj-label" style="margin-bottom:4px">Time cap</label>
      <input class="fj-input" style="height:38px" value="${c.cap}" placeholder="ej. 20:00" onchange="CATS[${bi}].cap=this.value;render()"></div>
    <div><label class="fj-label" style="margin-bottom:4px">Descanso entre rondas</label>
      <input class="fj-input" style="height:38px" value="${c.rest}" placeholder="ej. 1:00" onchange="CATS[${bi}].rest=this.value;render()"></div>
    <div><label class="fj-label" style="margin-bottom:4px">Modo de trabajo</label>
      <select class="fj-input" style="height:38px" onchange="CATS[${bi}].mode=this.value;render()">
        <option value="individual" ${c.mode==='individual'?'selected':''}>Individual</option>
        <option value="duplas" ${c.mode==='duplas'?'selected':''}>En duplas</option>
        <option value="equipo" ${c.mode==='equipo'?'selected':''}>Equipos</option></select></div>
    <label style="grid-column:span 2;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fj-ink-700);cursor:pointer;align-self:end;padding-bottom:9px">
      <input type="checkbox" ${c.lb?'checked':''} onchange="CATS[${bi}].lb=this.checked;render()" style="accent-color:var(--fj-brand);width:16px;height:16px"> Registrar resultado en el leaderboard</label>
  </div>`;
}

function catBlock(c,bi){
  return `<div class="cat">
    <div class="cat-head" style="flex-wrap:wrap">
      <span class="fj-eyebrow" style="font-size:13px;color:var(--fj-ink-900)">${c.name}</span>
      <span class="fj-fmt fj-fmt-${c.fmt==='series'?'rx':c.fmt}">${fmtLabel(c.fmt)}</span>
      ${c.lb?'<span class="fj-badge fj-badge-success" style="height:20px">▲ Leaderboard</span>':'<span class="fj-badge fj-badge-neutral" style="height:20px">Sin ranking</span>'}
      ${c.cap?`<span class="fj-badge fj-badge-neutral fj-mono" style="height:20px">⏱ ${c.cap}</span>`:''}
      ${c.mode!=='individual'?`<span class="fj-badge fj-badge-info" style="height:20px">${MODEL[c.mode]}</span>`:''}
      <button class="fj-btn fj-btn-ghost fj-btn-sm" style="margin-left:auto;height:30px" onclick="toggleCfg(${bi})">${c.open?'▾ Ajustes':'⚙ Ajustes'}</button>
      <button class="fj-icon-btn" style="width:28px;height:28px" onclick="delCat(${bi})" aria-label="Quitar categoría">${xsvg}</button>
    </div>
    ${c.open?cfgStrip(c,bi):''}
    <div class="cat-zone" data-fj-dropzone data-cat="${bi}">
      ${c.items.length ? c.items.map((it,ii)=>exRow(it,bi,ii)).join('') : '<div class="cat-empty">Arrastra ejercicios aquí desde la biblioteca</div>'}
    </div>
  </div>`;
}

function restBlock(c,bi){
  return `<div style="display:flex;align-items:center;gap:10px;padding:9px 16px;border:1px dashed var(--fj-ink-200);border-radius:12px;background:var(--fj-ink-50)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A91A1" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span class="fj-eyebrow">Descanso entre categorías</span>
    <input class="mini" value="${c.dur}" style="width:72px" onchange="CATS[${bi}].dur=this.value">
    <button class="fj-icon-btn" style="width:26px;height:26px;margin-left:auto" onclick="delCat(${bi})" aria-label="Quitar descanso">${xsvg}</button>
  </div>`;
}

function render(){
  document.getElementById('lib').innerHTML = libHtml();
  document.getElementById('canvas').innerHTML = CATS.map((c,bi)=> c.type==='rest'?restBlock(c,bi):catBlock(c,bi)).join('') + `
    <div style="display:flex;gap:10px">
      <button onclick="openAddCat()" class="cat-empty" style="flex:1;cursor:pointer;border-style:dashed;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;color:var(--fj-ink-500);font-weight:600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Agregar categoría
      </button>
      <button onclick="addRest()" class="cat-empty" style="cursor:pointer;border-style:dashed;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 18px;color:var(--fj-ink-500);font-weight:600">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Descanso
      </button>
    </div>
    <p class="text-xs text-ink-400" style="padding:0 4px">💡 Si el peso va en <b>%1RM</b>, cada atleta ve su propio peso en la app calculado desde su PR registrado.</p>
    <div class="fj-panel" style="padding:16px;margin-top:4px">
      <label class="fj-label">Nota del coach</label>
      <textarea class="fj-input" placeholder="Escala recomendada, foco técnico, tiempo de corte…">Mantener cadencia en los thrusters. Scaled: jumping pull-ups.</textarea>
    </div>
    <div class="fj-panel" style="padding:16px;margin-top:4px">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fj-ink-700);cursor:pointer">
        <input type="checkbox" ${DUEL.on?'checked':''} onchange="DUEL.on=this.checked;render()" style="accent-color:var(--fj-brand);width:16px;height:16px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--fj-brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" y1="14" x2="9" y2="18"/><line x1="7" y1="17" x2="4" y2="20"/><line x1="3" y1="19" x2="5" y2="21"/></svg>
        Disponible como rutina de duelo
      </label>
      <p class="text-xs text-ink-400" style="margin:6px 0 0 24px">Los atletas podrán retarse con esta rutina desde la app. Cada reto pasa por aprobación del box.</p>
      ${DUEL.on?`<div style="margin:12px 0 0 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div><label class="fj-label" style="margin-bottom:4px">Logro robable asociado</label>
        <input class="fj-input" style="height:38px;width:220px" value="${DUEL.belt}" onchange="DUEL.belt=this.value" placeholder="Ej: Rey de Fran"></div>
        <p class="text-xs text-ink-400" style="align-self:end;padding-bottom:9px">Único por rutina: lo tiene una persona y se roba ganando el duelo. <a href="duelos-desafios.html" class="text-brand-600 font-semibold hover:underline">Ver logros →</a></p>
      </div>`:''}
    </div>`;
}

function toggleCfg(bi){ CATS[bi].open=!CATS[bi].open; render(); }
function delEx(ci,ii){ CATS[ci].items.splice(ii,1); render(); }
function delCat(bi){ CATS.splice(bi,1); render(); }
function addRest(){ CATS.push({type:'rest', dur:'2:00'}); render(); }

function openAddCat(){
  Forja.Drawer.open(`
    <div class="fj-drawer-head"><h2 class="font-display font-bold text-lg">Agregar categoría</h2>
      <button class="fj-icon-btn" data-fj-close aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="fj-drawer-body space-y-4">
      <div><p class="fj-eyebrow mb-2">Plantillas de categoría</p>
        <div class="space-y-2">
          ${[['Warm-up','series'],['Skill','emom'],['Strength','series'],['WOD','fortime'],['Accessory','series'],['Cooldown','series']].map(t=>
            `<button onclick="addCat('${t[0]}','${t[1]}')" class="fj-row" style="width:100%;border:1px solid var(--fj-ink-200);border-radius:11px;margin-bottom:0">
              <span class="fj-eyebrow" style="color:var(--fj-ink-900)">${t[0]}</span>
              <span class="fj-fmt fj-fmt-${t[1]==='series'?'rx':t[1]}" style="margin-left:auto">${(FORMATS.find(f=>f[0]===t[1])||['','—'])[1]}</span></button>`).join('')}
        </div>
      </div>
      <div class="fj-divider"></div>
      <div><label class="fj-label">O crea una nueva</label>
        <input class="fj-input" id="newCatName" placeholder="Nombre de la categoría">
      </div>
    </div>
    <div class="fj-drawer-foot">
      <button class="fj-btn fj-btn-ghost fj-btn-sm" data-fj-close>Cancelar</button>
      <button class="fj-btn fj-btn-primary fj-btn-sm" onclick="addCat(document.getElementById('newCatName').value||'Nueva categoría','fortime'); Forja.Drawer.close();">Agregar</button>
    </div>`);
}
function addCat(name,fmt){ CATS.push({type:'cat', name, fmt, lb:fmt!=='series'&&fmt!=='', cap:'', rest:'', mode:'individual', open:true, items:[]}); render(); Forja.Drawer.close(); }

function openTemplates(){
  Forja.Drawer.open(`
    <div class="fj-drawer-head"><div><p class="fj-eyebrow">CrossFit</p><h2 class="font-display font-bold text-lg">Cargar plantilla</h2></div>
      <button class="fj-icon-btn" data-fj-close aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="fj-drawer-body">
      <p class="text-xs text-ink-400 mb-3">Rutinas guardadas para esta modalidad</p>
      <div class="space-y-2">
        ${[['Fran','fortime','21-15-9 · Thrusters + Pull-ups'],['Helen','fortime','3 rondas · Run, KB, Pull-ups'],['Cindy','amrap','AMRAP 20\' · 5 PU, 10 push-up, 15 squat'],['Murph','fortime','Run, 100 PU, 200 push, 300 squat']].map(t=>
          `<button onclick="Forja.Drawer.close()" class="fj-row" style="width:100%;border:1px solid var(--fj-ink-200);border-radius:11px;margin-bottom:0">
            <span class="fj-fmt fj-fmt-${t[1]}">${t[1]==='fortime'?'For Time':t[1].toUpperCase()}</span>
            <div class="flex-1 text-left"><p class="text-sm font-bold text-ink-900">${t[0]}</p><p class="text-xs text-ink-400">${t[2]}</p></div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A91A1" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button>`).join('')}
      </div>
    </div>`);
}

render();
Forja.DnD.init({ onDrop(payload, zone){
  if(!payload) return;
  const ci = +zone.getAttribute('data-cat');
  CATS[ci].items.push({ex:payload, a:'10', b:'reps', w:''});
  render();
}});
</script>

<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forja · Nuevo plan</title>
<script>(function(){var w=console.warn;console.warn=function(){var a=arguments[0];if(typeof a==="string"&&a.indexOf("cdn.tailwindcss.com")!==-1)return;return w.apply(console,arguments)};})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/forja.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/forja.css">
<script src="../assets/forja.js"></script>
</head>
<body data-page="planes" data-title="Nuevo plan" data-eyebrow="Planes · Nuevo">
<div data-fj-content>
<div class="fj-pad fj-maxw">
<div class="fj-form-w space-y-4">

  <!-- Sección: Datos del plan -->
  <div class="fj-panel p-6 space-y-5">
    <div>
      <p class="fj-eyebrow mb-0.5">Configuración básica</p>
      <h2 class="fj-section-h">Datos del plan</h2>
    </div>

    <div>
      <label class="fj-label" for="plan-nombre">Nombre del plan</label>
      <input id="plan-nombre" type="text" placeholder="Ej: Full, 3x Semana, Pack 10…"
        class="fj-input w-full">
    </div>

    <div>
      <label class="fj-label" for="plan-descripcion">Descripción</label>
      <textarea id="plan-descripcion" rows="2" placeholder="Breve descripción visible al asignar el plan al socio…"
        class="fj-input w-full resize-none"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="fj-label" for="plan-precio">Precio mensual (CLP)</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 font-mono font-bold text-sm text-ink-400 pointer-events-none">$</span>
          <input id="plan-precio" type="number" placeholder="89000" min="0"
            class="fj-input w-full pl-8 font-mono font-bold">
        </div>
      </div>
      <div>
        <label class="fj-label" for="plan-periodicidad">Periodicidad</label>
        <select id="plan-periodicidad" class="fj-input w-full">
          <option value="mensual">Mensual</option>
          <option value="trimestral">Trimestral</option>
          <option value="semestral">Semestral</option>
          <option value="anual">Anual</option>
          <option value="pack">Pack de clases (sin vencimiento)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Sección: Acceso -->
  <div class="fj-panel p-6 space-y-5">
    <div>
      <p class="fj-eyebrow mb-0.5">Permisos</p>
      <h2 class="fj-section-h">Acceso</h2>
    </div>

    <div>
      <label class="fj-label mb-3">Modalidades incluidas</label>
      <div class="space-y-3">
        <label class="flex items-center gap-3 cursor-pointer group">
          <input type="checkbox" checked class="w-4 h-4 accent-[#FB5215] cursor-pointer shrink-0">
          <span class="fj-dot shrink-0" style="background:var(--m-crossfit)"></span>
          <span class="text-sm font-medium text-ink-900">CrossFit</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer group">
          <input type="checkbox" class="w-4 h-4 accent-[#FB5215] cursor-pointer shrink-0">
          <span class="fj-dot shrink-0" style="background:var(--m-gimnasia)"></span>
          <span class="text-sm font-medium text-ink-900">Gimnasia</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer group">
          <input type="checkbox" class="w-4 h-4 accent-[#FB5215] cursor-pointer shrink-0">
          <span class="fj-dot shrink-0" style="background:var(--m-haltero)"></span>
          <span class="text-sm font-medium text-ink-900">Halterofilia</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer group">
          <input type="checkbox" class="w-4 h-4 accent-[#FB5215] cursor-pointer shrink-0">
          <span class="fj-dot shrink-0" style="background:var(--m-endurance)"></span>
          <span class="text-sm font-medium text-ink-900">Endurance</span>
        </label>
      </div>
    </div>

    <div>
      <label class="fj-label mb-3">Clases por semana</label>
      <div class="grid grid-cols-2 gap-3">
        <label class="flex items-center gap-3 p-3.5 rounded-xl border-2 border-brand-400 bg-brand-50 cursor-pointer">
          <input type="radio" name="clases-semana" checked class="accent-[#FB5215] shrink-0">
          <span class="text-sm font-semibold text-ink-900">Ilimitadas</span>
        </label>
        <label class="flex items-center gap-3 p-3.5 rounded-xl border border-ink-200 bg-white cursor-pointer hover:border-ink-300 transition-colors">
          <input type="radio" name="clases-semana" class="accent-[#FB5215] shrink-0">
          <div class="flex items-center gap-2">
            <span class="text-sm font-semibold text-ink-900">Cantidad:</span>
            <input type="number" placeholder="3" min="1" max="7"
              class="w-16 h-7 px-2 rounded-lg border border-ink-200 text-sm font-mono font-bold text-center text-ink-900 focus:outline-none focus:border-brand-500 bg-white"
              onclick="event.stopPropagation()" aria-label="Número de clases por semana">
            <span class="text-xs text-ink-400">/sem</span>
          </div>
        </label>
      </div>
    </div>
  </div>

  <!-- Sección: Visibilidad -->
  <div class="fj-panel p-6">
    <div class="mb-5">
      <p class="fj-eyebrow mb-0.5">Disponibilidad</p>
      <h2 class="fj-section-h">Visibilidad</h2>
    </div>

    <div class="flex items-center justify-between py-3.5 px-4 rounded-xl border border-ink-200 bg-ink-50">
      <div>
        <p class="text-sm font-semibold text-ink-900">Activo</p>
        <p class="text-xs text-ink-400 mt-0.5">El plan aparece disponible al asignar membresía a un socio</p>
      </div>
      <button class="relative w-11 h-6 rounded-full bg-brand-500 cursor-pointer shrink-0 transition-colors"
        role="switch" aria-checked="true" aria-label="Activar plan">
        <span class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-sm transition-transform"></span>
      </button>
    </div>
  </div>

</div>
</div>
</div>
<script>
Forja.SaveBar.bindDirty('[data-fj-content]', { msg:'Completa el plan' });
document.querySelector('[data-fj-save]').textContent = 'Crear plan';
Forja.SaveBar.show();
</script>
</body>
</html>

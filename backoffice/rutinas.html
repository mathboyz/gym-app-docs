<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forja · Rutinas</title>
<script>(function(){var w=console.warn;console.warn=function(){var a=arguments[0];if(typeof a==="string"&&a.indexOf("cdn.tailwindcss.com")!==-1)return;return w.apply(console,arguments)};})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/forja.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/forja.css">
<script src="../assets/forja.js"></script>
</head>
<body data-page="rutinas" data-title="Rutinas" data-eyebrow="Forja Box · Plantillas" data-cta-label="Nueva rutina" data-cta-href="constructor-rutina.html">
<div data-fj-content>
<div class="fj-pad fj-maxw space-y-4">

  <!-- Selector de tipo de clase + búsqueda -->
  <div class="flex items-center justify-between gap-3 flex-wrap">
    <div class="fj-pills" id="modPills">
      <span class="fj-pill" aria-selected="true" data-mod="crossfit"><span class="fj-dot mr-1.5" style="background:var(--m-crossfit)"></span>CrossFit</span>
      <span class="fj-pill" data-mod="gimnasia"><span class="fj-dot mr-1.5" style="background:var(--m-gimnasia)"></span>Gimnasia</span>
      <span class="fj-pill" data-mod="haltero"><span class="fj-dot mr-1.5" style="background:var(--m-haltero)"></span>Halterofilia</span>
      <span class="fj-pill" data-mod="endurance"><span class="fj-dot mr-1.5" style="background:var(--m-endurance)"></span>Endurance</span>
    </div>
    <div class="fj-search" style="display:block"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Buscar rutina o benchmark…"></div>
  </div>

  <!-- Lista de plantillas -->
  <div class="fj-list">
    <div class="fj-list-head">
      <span class="flex-1">Rutina</span>
      <span style="width:120px">Formato</span>
      <span style="width:140px">Categorías</span>
      <span style="width:110px">Último uso</span>
      <span style="width:40px"></span>
    </div>
    <div id="routineList"></div>
  </div>

</div>
</div>

<script>
const ROUTINES = {
  crossfit:[
    {name:'Fran',fmt:'fortime',sum:'21-15-9 · Thrusters + Pull-ups',cats:'Warm-up · Skill · WOD',used:'Hoy',duel:'Rey de Fran'},
    {name:'Helen',fmt:'fortime',sum:'3 rondas · Run 400m, 21 KB, 12 Pull-ups',cats:'Warm-up · WOD',used:'hace 2 días',duel:'Helen Master'},
    {name:'Cindy',fmt:'amrap',sum:"AMRAP 20' · 5 Pull-up, 10 Push-up, 15 Squat",cats:'Warm-up · WOD',used:'hace 5 días',duel:'Cindy Queen'},
    {name:'Murph',fmt:'fortime',sum:'Run 1.6k, 100 PU, 200 Push, 300 Squat, Run 1.6k',cats:'Warm-up · WOD · Cooldown',used:'hace 1 sem'},
    {name:'Grace',fmt:'fortime',sum:'30 Clean & Jerk @ 60kg',cats:'Skill · WOD',used:'hace 1 sem',duel:'Amo de Grace'},
    {name:'EMOM Pesado',fmt:'emom',sum:"EMOM 16' · Power Clean + Front Squat",cats:'Warm-up · Strength · WOD',used:'hace 2 sem'},
  ],
  gimnasia:[
    {name:'Skill HSPU',fmt:'series',sum:'Progresión handstand push-up + hollow',cats:'Warm-up · Skill',used:'hace 3 días'},
    {name:'Movilidad + core',fmt:'series',sum:'Movilidad de cadera + plancha + hollow rocks',cats:'Warm-up · Accessory',used:'hace 6 días'},
  ],
  haltero:[
    {name:'Snatch técnico',fmt:'emom',sum:"EMOM 12' · Snatch progresivo",cats:'Warm-up · Skill · Strength',used:'hace 1 día'},
    {name:'Clean & Jerk 5×3',fmt:'series',sum:'5 series de 3 @ 80% 1RM',cats:'Warm-up · Strength',used:'hace 4 días'},
  ],
  endurance:[
    {name:'5k + remo',fmt:'fortime',sum:'Run 5k · Row 2k · cooldown',cats:'Warm-up · WOD · Cooldown',used:'hace 2 días'},
    {name:'Intervalos Assault',fmt:'tabata',sum:'Tabata Assault Bike · 8 rondas',cats:'Warm-up · WOD',used:'hace 1 sem'},
  ],
};
const FMTLABEL = {fortime:'For Time',amrap:'AMRAP',emom:'EMOM',tabata:'Tabata',series:'Series'};

function render(mod){
  const list = ROUTINES[mod]||[];
  document.getElementById('routineList').innerHTML = list.length ? list.map(r=>`
    <a href="constructor-rutina.html" class="fj-row">
      <div class="flex-1 min-w-0"><p class="text-sm font-bold text-ink-900">${r.name}${r.duel?` <span class="fj-badge fj-badge-brand ml-1" title="Rutina de duelo · logro: ${r.duel}" style="gap:4px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" y1="14" x2="9" y2="18"/></svg>Duelo</span>`:''}</p><p class="text-xs text-ink-400">${r.sum}${r.duel?` · Logro robable: ${r.duel}`:''}</p></div>
      <div style="width:120px"><span class="fj-fmt fj-fmt-${r.fmt==='series'?'rx':r.fmt}">${FMTLABEL[r.fmt]}</span></div>
      <div style="width:140px" class="text-xs text-ink-500">${r.cats}</div>
      <div style="width:110px" class="fj-mono text-xs text-ink-400">${r.used}</div>
      <div style="width:40px"><span class="fj-icon-btn" style="width:30px;height:30px" aria-label="Editar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></span></div>
    </a>`).join('')
    : '<div class="fj-empty"><p class="text-sm text-ink-400">No hay rutinas para esta modalidad todavía.</p></div>';
}

document.getElementById('modPills').addEventListener('click', e=>{
  const p = e.target.closest('[data-mod]'); if(!p) return;
  document.querySelectorAll('#modPills .fj-pill').forEach(x=>x.setAttribute('aria-selected','false'));
  p.setAttribute('aria-selected','true');
  render(p.getAttribute('data-mod'));
});
render('crossfit');
</script>
</body>
</html>

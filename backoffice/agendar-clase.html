<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forja · Nueva clase</title>
<script>(function(){var w=console.warn;console.warn=function(){var a=arguments[0];if(typeof a==="string"&&a.indexOf("cdn.tailwindcss.com")!==-1)return;return w.apply(console,arguments)};})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/forja.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/forja.css">
<script src="../assets/forja.js"></script>
</head>
<body data-page="calendario" data-title="Nueva clase" data-eyebrow="Calendario · Agendar">
<div data-fj-content>
  <div class="fj-pad fj-maxw">
    <div class="fj-form-w space-y-5">

      <!-- Sección: Modalidad -->
      <div class="fj-panel p-6 space-y-4">
        <div class="flex items-center gap-2 pb-4 border-b border-ink-100">
          <span class="w-7 h-7 rounded-lg bg-brand-50 grid place-items-center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FB5215" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-8 8M4 20l5-5"/></svg>
          </span>
          <h2 class="font-display font-semibold text-base text-ink-900">Modalidad</h2>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <!-- CrossFit -->
          <label class="cursor-pointer">
            <input type="radio" name="modalidad" value="crossfit" class="sr-only" checked>
            <div class="flex items-center gap-3 px-4 py-3.5 rounded-xl border-2 border-brand-400 bg-brand-50/60 transition">
              <span class="fj-dot shrink-0" style="background:var(--m-crossfit)"></span>
              <div>
                <p class="text-sm font-semibold text-ink-900">CrossFit</p>
                <p class="text-xs text-ink-400">WOD · Funcional</p>
              </div>
            </div>
          </label>
          <!-- Gimnasia -->
          <label class="cursor-pointer">
            <input type="radio" name="modalidad" value="gimnasia" class="sr-only">
            <div class="flex items-center gap-3 px-4 py-3.5 rounded-xl border border-ink-200 bg-white hover:border-info/50 hover:bg-blue-50/30 transition">
              <span class="fj-dot shrink-0" style="background:var(--m-gimnasia)"></span>
              <div>
                <p class="text-sm font-semibold text-ink-900">Gimnasia</p>
                <p class="text-xs text-ink-400">Movimientos de piso</p>
              </div>
            </div>
          </label>
          <!-- Halterofilia -->
          <label class="cursor-pointer">
            <input type="radio" name="modalidad" value="haltero" class="sr-only">
            <div class="flex items-center gap-3 px-4 py-3.5 rounded-xl border border-ink-200 bg-white hover:border-violet-400/50 hover:bg-violet-50/30 transition">
              <span class="fj-dot shrink-0" style="background:var(--m-haltero)"></span>
              <div>
                <p class="text-sm font-semibold text-ink-900">Halterofilia</p>
                <p class="text-xs text-ink-400">Snatch · Clean &amp; Jerk</p>
              </div>
            </div>
          </label>
          <!-- Endurance -->
          <label class="cursor-pointer">
            <input type="radio" name="modalidad" value="endurance" class="sr-only">
            <div class="flex items-center gap-3 px-4 py-3.5 rounded-xl border border-ink-200 bg-white hover:border-success/50 hover:bg-green-50/30 transition">
              <span class="fj-dot shrink-0" style="background:var(--m-endurance)"></span>
              <div>
                <p class="text-sm font-semibold text-ink-900">Endurance</p>
                <p class="text-xs text-ink-400">Running · Cardio</p>
              </div>
            </div>
          </label>
        </div>
      </div>

      <!-- Sección: Horario -->
      <div class="fj-panel p-6 space-y-5">
        <div class="flex items-center gap-2 pb-4 border-b border-ink-100">
          <span class="w-7 h-7 rounded-lg bg-ink-50 grid place-items-center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A6172" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </span>
          <h2 class="font-display font-semibold text-base text-ink-900">Horario</h2>
        </div>

        <div>
          <label class="fj-label" for="fecha">Fecha <span class="text-danger">*</span></label>
          <input id="fecha" type="date" value="2026-06-10" class="fj-input">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="fj-label" for="hora-inicio">Hora inicio <span class="text-danger">*</span></label>
            <input id="hora-inicio" type="time" value="07:00" class="fj-input font-mono">
          </div>
          <div>
            <label class="fj-label" for="duracion">Duración</label>
            <select id="duracion" class="fj-input">
              <option>30 min</option>
              <option>45 min</option>
              <option selected>60 min</option>
              <option>75 min</option>
              <option>90 min</option>
            </select>
          </div>
        </div>

        <!-- Repetir cada semana -->
        <div class="space-y-3">
          <label class="flex items-center gap-2.5 cursor-pointer select-none">
            <input type="checkbox" id="repetir" class="sr-only peer">
            <span class="w-10 h-6 rounded-full border-2 border-ink-300 bg-ink-100 relative transition-colors peer-checked:bg-brand-500 peer-checked:border-brand-500 shrink-0 after:absolute after:top-0.5 after:left-0.5 after:w-4 after:h-4 after:rounded-full after:bg-white after:shadow after:transition-transform peer-checked:after:translate-x-4"></span>
            <span class="text-sm font-medium text-ink-700">Repetir cada semana</span>
          </label>

          <!-- Días de la semana -->
          <div class="flex gap-1.5 flex-wrap">
            <label class="cursor-pointer">
              <input type="checkbox" name="dias" value="lun" class="sr-only peer">
              <span class="flex items-center justify-center w-10 h-10 rounded-full border border-ink-200 text-sm font-semibold text-ink-500 peer-checked:bg-brand-500 peer-checked:border-brand-500 peer-checked:text-white hover:border-brand-300 transition select-none">L</span>
            </label>
            <label class="cursor-pointer">
              <input type="checkbox" name="dias" value="mar" class="sr-only peer" checked>
              <span class="flex items-center justify-center w-10 h-10 rounded-full border border-ink-200 text-sm font-semibold text-ink-500 peer-checked:bg-brand-500 peer-checked:border-brand-500 peer-checked:text-white hover:border-brand-300 transition select-none">M</span>
            </label>
            <label class="cursor-pointer">
              <input type="checkbox" name="dias" value="mie" class="sr-only peer">
              <span class="flex items-center justify-center w-10 h-10 rounded-full border border-ink-200 text-sm font-semibold text-ink-500 peer-checked:bg-brand-500 peer-checked:border-brand-500 peer-checked:text-white hover:border-brand-300 transition select-none">X</span>
            </label>
            <label class="cursor-pointer">
              <input type="checkbox" name="dias" value="jue" class="sr-only peer" checked>
              <span class="flex items-center justify-center w-10 h-10 rounded-full border border-ink-200 text-sm font-semibold text-ink-500 peer-checked:bg-brand-500 peer-checked:border-brand-500 peer-checked:text-white hover:border-brand-300 transition select-none">J</span>
            </label>
            <label class="cursor-pointer">
              <input type="checkbox" name="dias" value="vie" class="sr-only peer">
              <span class="flex items-center justify-center w-10 h-10 rounded-full border border-ink-200 text-sm font-semibold text-ink-500 peer-checked:bg-brand-500 peer-checked:border-brand-500 peer-checked:text-white hover:border-brand-300 transition select-none">V</span>
            </label>
            <label class="cursor-pointer">
              <input type="checkbox" name="dias" value="sab" class="sr-only peer" checked>
              <span class="flex items-center justify-center w-10 h-10 rounded-full border border-ink-200 text-sm font-semibold text-ink-500 peer-checked:bg-brand-500 peer-checked:border-brand-500 peer-checked:text-white hover:border-brand-300 transition select-none">S</span>
            </label>
            <label class="cursor-pointer">
              <input type="checkbox" name="dias" value="dom" class="sr-only peer">
              <span class="flex items-center justify-center w-10 h-10 rounded-full border border-ink-200 text-sm font-semibold text-ink-500 peer-checked:bg-brand-500 peer-checked:border-brand-500 peer-checked:text-white hover:border-brand-300 transition select-none">D</span>
            </label>
          </div>
          <p class="text-xs text-ink-400">Días en que se repite esta clase cada semana.</p>
        </div>
      </div>

      <!-- Sección: Detalles -->
      <div class="fj-panel p-6 space-y-5">
        <div class="flex items-center gap-2 pb-4 border-b border-ink-100">
          <span class="w-7 h-7 rounded-lg bg-ink-50 grid place-items-center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A6172" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <h2 class="font-display font-semibold text-base text-ink-900">Detalles</h2>
        </div>

        <div>
          <label class="fj-label" for="coach">Coach <span class="text-danger">*</span></label>
          <select id="coach" class="fj-input">
            <option value="">Seleccionar coach…</option>
            <option selected>Vale Fuentes</option>
            <option>Nacho Tapia</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="fj-label" for="cupos">Cupos <span class="text-danger">*</span></label>
            <input id="cupos" type="number" min="1" max="50" value="12" class="fj-input font-mono" placeholder="0">
          </div>
          <div>
            <label class="fj-label" for="sobrecupo">Sobrecupo permitido</label>
            <input id="sobrecupo" type="number" min="0" max="10" value="2" class="fj-input font-mono" placeholder="0">
            <p class="text-xs text-ink-400 mt-1.5">Cupos extra en lista de espera.</p>
          </div>
        </div>
      </div>

      <!-- Sección: Rutina -->
      <div class="fj-panel p-6 space-y-5">
        <div class="flex items-center gap-2 pb-4 border-b border-ink-100">
          <span class="w-7 h-7 rounded-lg bg-ink-50 grid place-items-center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A6172" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          </span>
          <h2 class="font-display font-semibold text-base text-ink-900">Rutina</h2>
        </div>

        <div>
          <label class="fj-label" for="rutina">Rutina asignada</label>
          <select id="rutina" class="fj-input">
            <option value="">Sin rutina</option>
            <option value="fran">Fran — For Time 21-15-9</option>
            <option value="cindy">Cindy — AMRAP 20'</option>
            <option value="karen">Karen — 150 Wall Balls</option>
            <option value="grace">Grace — 30 Clean &amp; Jerk @60kg</option>
            <option value="diane">Diane — 21-15-9 DL + HSPU</option>
          </select>
          <p class="text-xs text-ink-400 mt-2">
            O <a href="constructor-rutina.html" class="text-brand-600 font-semibold hover:text-brand-700 underline underline-offset-2">crea una nueva rutina en el constructor →</a>
          </p>
        </div>
      </div>

    </div><!-- /fj-form-w -->
  </div>
</div>

<script>
Forja.SaveBar.bindDirty('[data-fj-content]', { msg: 'Completa la clase' });
document.querySelector('[data-fj-save]').textContent = 'Agendar clase';
Forja.SaveBar.show();
</script>
</body>
</html>

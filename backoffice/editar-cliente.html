<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forja · Editar cliente</title>
<script>(function(){var w=console.warn;console.warn=function(){var a=arguments[0];if(typeof a==="string"&&a.indexOf("cdn.tailwindcss.com")!==-1)return;return w.apply(console,arguments)};})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/forja.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/forja.css">
<script src="../assets/forja.js"></script>
</head>
<body data-page="clientes" data-title="Editar cliente" data-eyebrow="Clientes · Camila Soto">
<div data-fj-content>
  <div class="fj-pad fj-maxw fj-form-w space-y-5">

    <!-- Datos personales -->
    <div class="fj-panel p-6 space-y-5">
      <p class="fj-section-h border-b border-ink-100 pb-3">Datos personales</p>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="fj-label" for="nombre">Nombre <span class="text-danger">*</span></label>
          <input id="nombre" type="text" value="Camila" class="fj-input w-full">
        </div>
        <div>
          <label class="fj-label" for="apellido">Apellido <span class="text-danger">*</span></label>
          <input id="apellido" type="text" value="Soto Vargas" class="fj-input w-full">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="fj-label" for="rut">RUT <span class="text-danger">*</span></label>
          <input id="rut" type="text" value="12.345.678-9" class="fj-input w-full font-mono">
        </div>
        <div>
          <label class="fj-label" for="fechanac">Fecha de nacimiento</label>
          <input id="fechanac" type="date" value="1995-08-14" class="fj-input w-full">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="fj-label" for="email">Email <span class="text-danger">*</span></label>
          <input id="email" type="email" value="camila.soto@gmail.com" class="fj-input w-full">
        </div>
        <div>
          <label class="fj-label" for="telefono">Teléfono</label>
          <input id="telefono" type="tel" value="+56 9 8765 4321" class="fj-input w-full">
        </div>
      </div>

      <div>
        <label class="fj-label">Género</label>
        <div class="flex items-center gap-5 mt-1">
          <label class="flex items-center gap-2 cursor-pointer text-sm text-ink-700">
            <input type="radio" name="genero" value="F" checked class="accent-brand-500 w-4 h-4"> Femenino
          </label>
          <label class="flex items-center gap-2 cursor-pointer text-sm text-ink-700">
            <input type="radio" name="genero" value="M" class="accent-brand-500 w-4 h-4"> Masculino
          </label>
          <label class="flex items-center gap-2 cursor-pointer text-sm text-ink-700">
            <input type="radio" name="genero" value="NB" class="accent-brand-500 w-4 h-4"> No binario
          </label>
          <label class="flex items-center gap-2 cursor-pointer text-sm text-ink-700">
            <input type="radio" name="genero" value="-" class="accent-brand-500 w-4 h-4"> Prefiero no decir
          </label>
        </div>
      </div>
    </div>

    <!-- Membresía -->
    <div class="fj-panel p-6 space-y-5">
      <p class="fj-section-h border-b border-ink-100 pb-3">Membresía</p>

      <div>
        <label class="fj-label" for="plan">Plan <span class="text-danger">*</span></label>
        <select id="plan" class="fj-input w-full appearance-none">
          <option>3x por semana — $45.000/mes</option>
          <option selected>Full — $89.000/mes</option>
          <option>Ilimitado — $110.000/mes</option>
          <option>Pack 10 clases — $55.000</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="fj-label" for="estado">Estado</label>
          <select id="estado" class="fj-input w-full appearance-none">
            <option selected>Activo</option>
            <option>Suspendido</option>
            <option>Dado de baja</option>
          </select>
        </div>
        <div>
          <label class="fj-label" for="metodo-pago">Método de pago</label>
          <select id="metodo-pago" class="fj-input w-full appearance-none">
            <option selected>Transferencia bancaria</option>
            <option>Efectivo</option>
            <option>Débito automático</option>
            <option>Webpay</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="fj-label" for="inicio">Fecha de inicio <span class="text-danger">*</span></label>
          <input id="inicio" type="date" value="2024-03-01" class="fj-input w-full">
        </div>
        <div>
          <label class="fj-label" for="vencimiento">Próximo vencimiento</label>
          <input id="vencimiento" type="date" value="2026-06-30" class="fj-input w-full">
        </div>
      </div>
    </div>

    <!-- Notas adicionales -->
    <div class="fj-panel p-6 space-y-4">
      <p class="fj-section-h border-b border-ink-100 pb-3">Notas adicionales</p>
      <div>
        <label class="fj-label" for="notas">Notas internas</label>
        <textarea id="notas" rows="4" class="fj-input w-full resize-none">Tendinitis en rodilla derecha. Evitar saltos de alto impacto por 2 semanas. Prefiere clases de las 09:00.</textarea>
      </div>
    </div>

    <!-- Zona de riesgo -->
    <div class="fj-panel p-6 border border-ink-200">
      <p class="fj-eyebrow mb-4">Zona de riesgo</p>
      <div class="flex items-center justify-between gap-4">
        <div>
          <p class="text-sm font-semibold text-ink-900">Dar de baja al cliente</p>
          <p class="text-xs text-ink-400 mt-0.5">Se desactivará la cuenta y se detendrá la membresía activa.</p>
        </div>
        <button type="button" class="fj-btn fj-btn-danger fj-btn-sm shrink-0">Dar de baja</button>
      </div>
    </div>

  </div>
</div>

<script>
Forja.SaveBar.bindDirty('[data-fj-content]', {
  msg: 'Tienes cambios sin guardar',
  onSave() { Forja.SaveBar.hide(); },
  onDiscard() { location.reload(); }
});
</script>
</body>
</html>
